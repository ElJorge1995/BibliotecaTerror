    <!-- Tipografías self-hosted (V2 2026-05-07): se sirven desde /fonts/ del propio dominio.
         Antes se cargaban de Google Fonts CDN, lo que provocaba CLS=0.30 por reflow al swap
         y enviaba la IP del visitante a Google (problema RGPD). El @font-face "Grenze Fallback"
         está definido en src/style.css con métricas ajustadas para que el swap sea invisible.
         Solo precargamos Grenze 400-800 (cuerpo de toda la app); Germania One e italic son
         menos críticos y se descargan bajo demanda. -->
    <link rel="preload" href="/fonts/grenze-normal-400-800.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Preconnect a CDN de portadas (archive.org) para acelerar la primera carga de imágenes -->
